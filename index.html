<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Minhas Tarefas</h1>
        <p>Organize o seu dia a dia</p>
    </header>
    <main class="main-content">
        <section class="task-form-container">
            <form class="task-form">
                <input type="text" placeholder="Digite uma nova tarefa..." aria-label="Nova tarefa">
                <button type="submit">Adicionar</button>
            </form>
        </section>
        <section class="filter-container">
            <label for="filter">Filtrar tarefas:</label>
            <select id="filter">
                <option value="all">Todas</option>
                <option value="pending">Pendentes</option>
                <option value="completed">Concluídas</option>
            </select>
        </section>
        <section class="task-list-container">
            <ul class="task-list"></ul>
        </section>
    </main>
    <footer class="main-footer">
        <p>&copy; 2026 - Gerenciador de Tarefas Pessoal</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
