<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>Minhas Tarefas</h1>
        <p>Organize o seu dia a dia</p>
    </header>

    <main class="main-content">
        <section class="task-form-container">
            <form class="task-form">
                <input type="text" placeholder="Digite uma nova tarefa..." aria-label="Nova tarefa">
                <button type="submit">Adicionar</button>
            </form>
        </section>

        <section class="task-list-container">
            <ul class="task-list">
                <li class="task-item">
                    <input type="checkbox" id="task-1">
                    <label for="task-1">Estudar HTML e CSS estruturado</label>
                    <button class="delete-btn">Excluir</button>
                </li>
                <li class="task-item completed">
                    <input type="checkbox" id="task-2" checked>
                    <label for="task-2">Criar o layout base do projeto</label>
                    <button class="delete-btn">Excluir</button>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="task-3">
                    <label for="task-3">Configurar tipografia responsiva</label>
                    <button class="delete-btn">Excluir</button>
                </li>
            </ul>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 - Gerenciador de Tarefas Pessoal</p>
    </footer>

</body>
</html>
